name: Daily PSC PDF Scraper

on:
  schedule:
    - cron: '0 2 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' 

    - name: Install Malayalam Fonts
      run: sudo apt-get update && sudo apt-get install -y fonts-smc

    - name: Install Dependencies
      run: npm install

    - name: Run Scraper Script
      run: node index.js

    - name: Upload PDF as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Daily-PSC-Notes
        path: PSC_Notes.pdf
